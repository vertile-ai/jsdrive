name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Enable the Chrome sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Test
        run: npm test

      - name: Install Zendriver reference
        run: |
          python3 -m venv .tmp/zendriver-ci
          .tmp/zendriver-ci/bin/python -m pip install zendriver==0.15.5

      - name: Validate parity inventory and run headless parity
        env:
          ZENDRIVER_PYTHON: ${{ github.workspace }}/.tmp/zendriver-ci/bin/python
        run: npm run test:parity:headless

      - name: Validate package contents
        run: |
          npm pack --workspace=guanine --dry-run
          npm pack --workspace=jsdriver --dry-run
