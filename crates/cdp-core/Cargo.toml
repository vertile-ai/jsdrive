[package]
name = "nodriver-cdp-core"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
futures-util = "0.3"
nodriver-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = "0.27"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
